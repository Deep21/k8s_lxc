---
- name: Afficher les hôtes des clusters cibles
  hosts: localhost
  gather_facts: false
  vars:
    target_clusters: "{{ target_cluster.split(';') | map('trim') | list }}"
  tasks:
    - name: Afficher les clusters cibles
      debug:
        msg: "Clusters cibles : {{ target_clusters }}"
      
    - name: Afficher les hôtes de chaque cluster
      debug:
        msg: "Cluster {{ item }} contient les hôtes masters : {{ groups[item + '_masters'] | default([]) }} et workers : {{ groups[item + '_workers'] | default([]) }}"
      loop: "{{ target_clusters }}"
      
    - name: Collecter tous les hôtes masters
      set_fact:
        all_masters: "{{ all_masters | default([]) + groups[item + '_masters'] | default([]) }}"
      loop: "{{ target_clusters }}"
      
    - name: Collecter tous les hôtes workers
      set_fact:
        all_workers: "{{ all_workers | default([]) + groups[item + '_workers'] | default([]) }}"
      loop: "{{ target_clusters }}"
      
    - name: Afficher tous les hôtes masters
      debug:
        msg: "Hôte master : {{ item }}"
      loop: "{{ all_masters }}"
      
    - name: Afficher tous les hôtes workers
      debug:
        msg: "Hôte worker : {{ item }}"
      loop: "{{ all_workers }}"
