---
- name: Supprimer des conteneurs LXD
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    container_to_delete: "{{ container_name | default('all') }}"
    force_delete: true
  
  tasks:
    - name: Récupérer la liste de tous les conteneurs
      shell: lxc list --format csv -c n
      register: container_list
      changed_when: false
      when: container_to_delete == 'all'
    
    - name: Arrêter et supprimer tous les conteneurs
      community.general.lxd_container:
        name: "{{ item }}"
        state: absent
        force_stop: "{{ force_delete }}"
      loop: "{{ container_list.stdout_lines | default([]) }}"
      when: container_to_delete == 'all'
      register: delete_all_result
      ignore_errors: yes
    
    - name: Supprimer un conteneur spécifique
      community.general.lxd_container:
        name: "{{ container_to_delete }}"
        state: absent
        force_stop: "{{ force_delete }}"
      when: container_to_delete != 'all'
      register: delete_specific_result
      ignore_errors: yes
