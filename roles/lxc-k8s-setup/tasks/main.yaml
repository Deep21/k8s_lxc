---
# Tâches principales du rôle lxc-k8s-setup

 # Configuration LXC (tâches existantes)
- include_tasks: lxc_setup.yaml
  when: inventory_hostname == 'localhost' 

# Installation des composants communs Kubernetes sur tous les nœuds
- include_tasks: k8s_master_node.yaml
  when: 
    - inventory_hostname == 'localhost'

# Installation des composants communs Kubernetes sur tous les nœuds
- include_tasks: k8s_worker_node.yaml
  when: 
    - inventory_hostname == 'localhost'

# Installation des composants communs Kubernetes sur tous les nœuds
- include_tasks: k8s_common.yaml
  when: inventory_hostname in groups['all']

# Installation des composants communs Kubernetes sur tous les nœuds
- include_tasks: k8s.yaml
  when:    
    - groups['masters'] is defined
    - inventory_hostname in groups['masters']

# Installation des composants communs Kubernetes sur tous les nœuds
- include_tasks: join.yaml
  when: 
    - groups['workers'] is defined
    - inventory_hostname in groups['workers']