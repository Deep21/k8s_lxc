---
- name: Initialiser le cluster Kubernetes avec débogage
  shell: |
    export KUBECONFIG=/etc/kubernetes/admin.conf
    kubeadm init --pod-network-cidr=10.244.0.0/16 \
                 --ignore-preflight-errors=all \
                 --v=5 \
                 --apiserver-advertise-address={{ ansible_default_ipv4.address }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init
  when: not k8s_config_exists.stat.exists
  failed_when: false

- name: Afficher la sortie de kubeadm init
  debug:
    var: kubeadm_init

- name: Créer le répertoire .kube pour root
  file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Copier le fichier de configuration admin.conf pour root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'
  when: kubeadm_init.changed

- name: Créer le répertoire .kube pour l'utilisateur ubuntu
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Copier le fichier de configuration admin.conf pour l'utilisateur ubuntu
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'

- name: Télécharger le manifeste Calico
  get_url:
    url: https://docs.projectcalico.org/manifests/calico.yaml
    dest: /home/ubuntu/calico.yaml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  when: 
    - cni_plugin == 'calico'

- name: Appliquer le manifeste Calico
  shell: kubectl apply -f /home/ubuntu/calico.yaml
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'calico'

- name: Installer Helm
  shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

- name: Ajouter le repo Helm Cilium
  shell: helm repo add cilium https://helm.cilium.io/
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'cilium'

- name: Mettre à jour les repos Helm
  shell: helm repo update
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'cilium'

- name: Vérifier l'existence du fichier cilium-values.yaml
  stat:
    path: "{{ playbook_dir }}/helm/cilium-values.yaml"
  register: cilium_values_file
  when: cni_plugin == 'cilium'
  delegate_to: localhost

- name: Vérifier l'existence du fichier cilium-values.yaml
  stat:
    path: "{{ playbook_dir }}/helm/cilium-values.yaml"
  register: cilium_values_file
  delegate_to: localhost 

- name: Copier le fichier cilium-values.yaml vers le control plane
  copy:
    src: "/home/mini/ansible/helm/cilium-values.yaml"
    dest: /tmp/cilium-values.yaml
    mode: '0644'

- name: Installer Cilium via Helm avec fichier de valeurs
  shell: |
    helm install cilium cilium/cilium \
      --namespace kube-system \
      --values /tmp/cilium-values.yaml
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'cilium'
  
- name: Vérifier l'état global du cluster
  shell: kubectl get nodes
  register: nodes_status
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false

- name: Afficher l'état des nœuds
  debug:
    var: nodes_status.stdout_lines
  when: nodes_status.stdout_lines is defined

- name: Afficher le CNI installé
  debug:
    msg: "CNI {{ cni_plugin }} installé avec succès sur le cluster"

- name: Générer la commande de jonction pour les nœuds worker
  shell: kubeadm token create --print-join-command
  register: join_command
  when: kubeadm_init is defined and kubeadm_init.changed or k8s_config_exists.stat.exists

- name: Sauvegarder la commande de jonction dans un fichier
  copy:
    content: "{{ join_command.stdout }}"
    dest: /root/join-command.txt
    mode: '0644'
  when: join_command is defined 

- name: Afficher la commande de jonction
  debug:
    var: join_command.stdout
  when: join_command is defined 

- name: Stocker le token de jointure
  set_fact:
    kubernetes_join_command: "{{ join_command.stdout }} --ignore-preflight-errors=all"
  when: join_command is defined 
