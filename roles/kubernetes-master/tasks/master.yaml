---
- name: Définir la variable CNI par défaut
  set_fact:
    cni_plugin: "{{ cni_plugin | default('cilium') }}"

- name: Vérifier si le cluster est déjà initialisé
  stat:
    path: /etc/kubernetes/admin.conf
  register: k8s_config_exists

- name: Initialiser le cluster Kubernetes
  shell: kubeadm init --pod-network-cidr=192.168.0.0/16 --ignore-preflight-errors=all
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init
  when: not k8s_config_exists.stat.exists

- name: Créer le répertoire .kube pour root
  file:
    path: /root/.kube
    state: directory
    mode: '0700'

- name: Copier le fichier de configuration admin.conf pour root
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: yes
    mode: '0600'
  when: kubeadm_init.changed

- name: Créer le répertoire .kube pour l'utilisateur ubuntu
  file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0700'

- name: Copier le fichier de configuration admin.conf pour l'utilisateur ubuntu
  copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/ubuntu/.kube/config
    remote_src: yes
    owner: ubuntu
    group: ubuntu
    mode: '0600'
  when: kubeadm_init.changed

- name: Télécharger le manifeste Calico
  get_url:
    url: https://docs.projectcalico.org/manifests/calico.yaml
    dest: /home/ubuntu/calico.yaml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  when: 
    - cni_plugin == 'calico'
    - kubeadm_init.changed

- name: Appliquer le manifeste Calico
  shell: kubectl apply -f /home/ubuntu/calico.yaml
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'calico'
    - kubeadm_init.changed

- name: Ajouter le repo Helm Cilium
  shell: helm repo add cilium https://helm.cilium.io/
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'cilium'
    - kubeadm_init.changed

- name: Mettre à jour les repos Helm
  shell: helm repo update
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'cilium'
    - kubeadm_init.changed

- name: Vérifier l'existence du fichier cilium-values.yaml
  stat:
    path: "{{ playbook_dir }}/helm/cilium-values.yaml"
  register: cilium_values_file
  when: cni_plugin == 'cilium'

- name: Installer Cilium via Helm avec fichier de valeurs
  shell: |
    helm install cilium cilium/cilium \
      --namespace kube-system \
      --values {{ playbook_dir }}/helm/cilium-values.yaml
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  when: 
    - cni_plugin == 'cilium'
    - kubeadm_init.changed
    - cilium_values_file.stat.exists

# Ajout de vérifications que le cluster est opérationnel
- name: Attendre que les composants du control plane soient prêts
  shell: kubectl get pods -n kube-system -l tier=control-plane -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -v False
  register: control_plane_ready
  until: control_plane_ready.rc == 0
  retries: 30
  delay: 10
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false
  ignore_errors: true

- name: Attendre que les pods CoreDNS soient prêts
  shell: kubectl get pods -n kube-system -l k8s-app=kube-dns -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -v False
  register: coredns_ready
  until: coredns_ready.rc == 0
  retries: 30
  delay: 10
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false
  ignore_errors: true

- name: Attendre que les pods Calico soient prêts
  shell: kubectl get pods -n kube-system -l k8s-app=calico-node -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -v False
  register: calico_ready
  until: calico_ready.rc == 0
  retries: 30
  delay: 10
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false
  ignore_errors: true
  when: cni_plugin == 'calico'

- name: Attendre que les pods Cilium soient prêts
  shell: kubectl get pods -n kube-system -l k8s-app=cilium -o jsonpath='{.items[*].status.conditions[?(@.type=="Ready")].status}' | grep -v False
  register: cilium_ready
  until: cilium_ready.rc == 0
  retries: 30
  delay: 10
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false
  ignore_errors: true
  when: cni_plugin == 'cilium'

- name: Vérifier l'état global du cluster
  shell: kubectl get nodes
  register: nodes_status
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false

- name: Afficher l'état des nœuds
  debug:
    var: nodes_status.stdout_lines
  when: nodes_status.stdout_lines is defined

- name: Vérifier que le nœud master est Ready
  shell: kubectl get nodes -o jsonpath='{.items[0].status.conditions[?(@.type=="Ready")].status}'
  register: master_ready
  become_user: ubuntu
  environment:
    KUBECONFIG: /home/ubuntu/.kube/config
  changed_when: false
  failed_when: master_ready.stdout != "True"
  ignore_errors: true

- name: Afficher le CNI installé
  debug:
    msg: "CNI {{ cni_plugin }} installé avec succès sur le cluster"

- name: Générer la commande de jonction pour les nœuds worker
  shell: kubeadm token create --print-join-command
  register: join_command
  when: kubeadm_init is defined and kubeadm_init.changed or k8s_config_exists.stat.exists

- name: Sauvegarder la commande de jonction dans un fichier
  copy:
    content: "{{ join_command.stdout }}"
    dest: /root/join-command.txt
    mode: '0644'
  when: join_command is defined 

- name: Afficher la commande de jonction
  debug:
    var: join_command.stdout
  when: join_command is defined 

- name: Stocker le token de jointure
  set_fact:
    kubernetes_join_command: "{{ join_command.stdout }} --ignore-preflight-errors=all"
  when: join_command is defined 
