---
- name: Créer le profil pour le master
  community.general.lxd_profile:
    name: "{{ k8s_cluster.master.k8s_profile_name }}"
    state: present
    config: "{{ k8s_cluster.master.profile_config }}"
    devices: "{{ k8s_cluster.master.devices }}"

- name: Créer le profil pour les workers
  community.general.lxd_profile:
    name: "{{ k8s_cluster.workers.k8s_profile_name }}"
    state: present
    config: "{{ k8s_cluster.workers.profile_config }}"
    devices: "{{ k8s_cluster.workers.devices }}"
